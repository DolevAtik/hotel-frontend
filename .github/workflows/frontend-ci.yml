name: Frontend CI Pipeline

on:
  push:
    branches:
      - dev
    # Only rebuild when the app image or the pipeline itself changes.
    # Excludes k8s/ so the manifest commit made by this workflow can't retrigger it.
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'config.js'
      - 'Dockerfile'
      - '.github/workflows/frontend-ci.yml'

# Needs write access to commit the updated image tag back to git for ArgoCD.
permissions:
  contents: write

# Serialize runs on the same branch so image push + manifest commit never race.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dolevatik/hotel-frontend

jobs:
  docker:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Sets up the docker-container driver, required for the type=gha cache backend.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Pin deployment manifest to the new immutable tag
        run: |
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${{ github.run_number }}|" k8s/deployment.yaml

      - name: Commit manifest update for ArgoCD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet k8s/deployment.yaml; then
            echo "Manifest already at target tag; nothing to commit."
          else
            git add k8s/deployment.yaml
            git commit -m "ci: deploy frontend ${IMAGE_NAME}:${{ github.run_number }} [skip ci]"
            git push
          fi
