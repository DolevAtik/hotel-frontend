name: Frontend CI Pipeline

on:
  push:
    branches:
      - dev
    # Only rebuild when the app image or the pipeline itself changes.
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'config.js'
      - 'Dockerfile'
      - '.github/workflows/frontend-ci.yml'

# GitOps: this pipeline no longer commits to this repo. It pushes the image-tag
# bump straight to hotel-infra's main (using secrets.PAT), so only read access
# is needed here.
permissions:
  contents: read

env:
  IMAGE_NAME: dolevatik/hotel-frontend

jobs:
  build-and-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Sets up the docker-container driver, required for the type=gha cache backend.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  update-infra:
    name: Update Infra Manifests
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hotel-infra
        uses: actions/checkout@v4
        with:
          repository: DolevAtik/hotel-infra
          ref: main
          token: ${{ secrets.PAT }}
          path: infra

      - name: Update Frontend Image
        run: |
          cd infra
          sed -i "s|image: dolevatik/hotel-frontend:.*|image: dolevatik/hotel-frontend:${{ github.sha }}|g" k8s/frontend/deployment.yaml

      # Push straight to main so ArgoCD (which tracks main) picks the bump up
      # on its next sync. No PR, no manual merge step.
      - name: Commit and Push to main
        working-directory: infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Manifest already pinned to ${{ github.sha }} - nothing to push."
            exit 0
          fi

          git commit -am "Update frontend image to ${{ github.sha }}"

          # Retry in case the backend pipeline pushed to main in the meantime.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed frontend image bump to main."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto latest main."
            git pull --rebase origin main
          done

          echo "Failed to push to main after 3 attempts."
          exit 1
